  baseUrl: /upptime
  logoUrl: https://raw.githubusercontent.com/upptime/upptime.js.org/master/static/img/icon.svg
  name: Pilue Status Monitor
  introTitle: "**Pilue Status Monitor**"
  introMessage: Uptime monitoring for all DavidCloud hosted services.
  navbar:
    - title: Status
      href: /
    - title: GitHub
      href: https://github.com/$OWNER/$REPO
  theme: ocean

